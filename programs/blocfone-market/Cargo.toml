[package]
name = "blocfone-market"
version = "0.1.0"
description = "blocfone® mode-1 marketplace program — Provider, OfferBatch, Order (beside the escrow, ADR-009)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "blocfone_market"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "1.1.2", features = ["init-if-needed"] }
anchor-spl = "1.1.2"
# On-chain security.txt (2026-09-10). Header-only macro; adds a small static
# blob to the program binary naming the security contact + policy.
solana-security-txt = "1.1.1"
# The modular Solana crates anchor-lang 1.x no longer re-exports; versions
# track what anchor-lang itself resolves (3.x line).
solana-instructions-sysvar = "3.0"
solana-sha256-hasher = "3.1"
