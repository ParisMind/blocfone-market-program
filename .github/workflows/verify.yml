name: verified-build

# Reproducible build of the on-chain program with solana-verify (Docker, which
# GitHub-hosted runners provide). Proves the source in this repo builds
# deterministically and prints the executable hash. The on-chain
# verify-from-repo (matching the deployed program) is run once the program is
# deployed from a build of this repo — see the README.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
          key: ${{ runner.os }}-solana-verify

      - name: Install solana-verify
        run: cargo install solana-verify --locked || true

      - name: Reproducible build (Docker)
        # Pin the verifiable-build image to a 4.1.x Agave (matches the local
        # toolchain and ships Rust >= 1.85, which the Solana crypto stack's
        # edition2024 crates require; the default image was Cargo 1.84 and
        # failed on zeroize_derive 1.5.0). This exact image is also what the
        # eventual on-chain verify must use.
        run: solana-verify build --base-image solanafoundation/solana-verifiable-build:4.1.1 --library-name blocfone_market

      - name: Executable hash
        run: |
          echo "Program: blocfone_market (6aYP8MQt44Zn91McAT7BU4gfoFoGxZ8H1jdNJuFVnS9R)"
          solana-verify get-executable-hash target/deploy/blocfone_market.so

      # One builder (2026-09-18): VERIFIED-HASH is the executable hash the
      # SOURCE repo's CI printed for this same source, copied here at sync time.
      # Same source must give the same bytes; if it does not, stop.
      - name: Hash equals the source repo's CI (VERIFIED-HASH)
        run: |
          BUILT="$(solana-verify get-executable-hash target/deploy/blocfone_market.so)"
          WANT="$(tr -d '[:space:]' < VERIFIED-HASH)"
          echo "built: $BUILT"; echo "want:  $WANT"
          [ "$BUILT" = "$WANT" ] || { echo "the mirror's bytes differ from the source repo's CI build"; exit 1; }

      - name: Upload verified .so (for the on-chain upgrade)
        uses: actions/upload-artifact@v4
        with:
          name: blocfone_market-verified-so
          path: target/deploy/blocfone_market.so
          if-no-files-found: error
