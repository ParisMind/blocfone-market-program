# Rust workspace for the on-chain programs only (docs/PLAN.md P1-01+).
# The Node side of the repo is untouched by this file.
[workspace]
members = ["programs/blocfone-market"]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
